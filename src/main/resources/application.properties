spring.application.name=subastar
spring.config.import=optional:classpath:local.properties

# ============================================================
# Base de datos
# ============================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ============================================================
# Flyway
# ============================================================
spring.flyway.enabled=${FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.validate-on-migrate=false

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG_LEVEL:WARN}

# ============================================================
# Puerto / Context path
# ============================================================
server.port=${PORT:8080}
server.servlet.context-path=/api/v1
server.forward-headers-strategy=framework

# ============================================================
# JWT
# ============================================================
jwt.secret=${JWT_SECRET:subastar-jwt-secret-key-for-signing-must-be-at-least-256-bits-long-local-dev}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# CORS
# ============================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8081,https://front-end-subast-ar.vercel.app}

# ============================================================
# Multipart / archivos
# ============================================================
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:50MB}
spring.servlet.multipart.enabled=true

# ============================================================
# Mail SMTP
# ============================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

# ============================================================
# Gmail API (OAuth2)
# ============================================================
gmail.api.client-id=${GMAIL_CLIENT_ID:}
gmail.api.client-secret=${GMAIL_CLIENT_SECRET:}
gmail.api.refresh-token=${GMAIL_REFRESH_TOKEN:}
gmail.api.from=${GMAIL_FROM:}

# ============================================================
# Cloudinary
# ============================================================
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# ============================================================
# Scheduler / Subasta
# ============================================================
app.scheduler.verificacion-medios-delay=${VERIFICACION_MEDIOS_DELAY:10000}
app.auction.initial-seconds=${LOTE_TIMEOUT_SIN_PUJAS:120}
app.auction.bid-extension-seconds=${LOTE_TIMEOUT_ENTRE_PUJAS:120}
app.auction.tick-ms=1000
subastar.empresa.cliente-id=${SUBASTAR_EMPRESA_CLIENTE_ID:1019}
app.scheduler.multas-delay=3600000

# ============================================================
# Jackson
# ============================================================
spring.jackson.serialization.write-dates-as-timestamps=false
